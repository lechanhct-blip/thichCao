name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins and Generate plugins.json
        run: |
          chmod +x gradlew
          
          # 1. Chạy task makeAll để build toàn bộ file .cs3
          ./gradlew makeAll --stacktrace

          # 2. Định hình lại task makePluginsJson có sẵn của plugin
          ./gradlew makePluginsJson --stacktrace

          # 3. Tạo thư mục chứa file đầu ra
          mkdir -p $GITHUB_WORKSPACE/builds

          # 4. Copy toàn bộ file .cs3 và plugins.json vào thư mục builds
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds \;
          find . -name "plugins.json" -exec cp {} $GITHUB_WORKSPACE/builds \;

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
