name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins and Generate Combined plugins.json
        run: |
          chmod +x gradlew
          ./gradlew makeAll --stacktrace

          mkdir -p $GITHUB_WORKSPACE/builds

          # 1. Copy toàn bộ file .cs3 tìm thấy vào thư mục builds
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds \;

          # 2. Gom tất cả manifest.json tạm thành 1 file plugins.json duy nhất
          python3 -c '
          import os, json, glob

          plugins = []
          # Quét tất cả file manifest.json được sinh ra ở các thư mục build con
          for manifest_path in glob.glob("**/build/manifest.json", recursive=True):
              try:
                  with open(manifest_path, "r", encoding="utf-8") as f:
                      data = json.load(f)
                      # Thêm URL tải file .cs3 tương ứng
                      cs3_name = data.get("name", "") + ".cs3"
                      data["url"] = f"https://raw.githubusercontent.com/{os.getenv(\"GITHUB_REPOSITORY\")}/builds/{cs3_name}"
                      plugins.append(data)
              except Exception as e:
                  print(f"Error reading {manifest_path}: {e}")

          # Ghi vào file plugins.json tổng
          with open(f"{os.getenv(\"GITHUB_WORKSPACE\")}/builds/plugins.json", "w", encoding="utf-8") as f:
              json.dump(plugins, f, indent=4, ensure_ascii=False)

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
