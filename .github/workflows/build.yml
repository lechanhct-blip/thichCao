name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins and Generate Combined plugins.json
        run: |
          chmod +x gradlew
          ./gradlew makeAll --stacktrace

          # Tạo thư mục chứa file xuất ra
          mkdir -p $GITHUB_WORKSPACE/dist

          # Copy toàn bộ file .cs3 vào thư mục dist (loại trừ chính thư mục dist để không bị lỗi cp)
          find . -path "./dist" -prune -o -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/dist \;

          # Chạy script Python tạo file plugins.json (đã sửa lỗi f-string)
          python3 -c '
          import os, json, glob

          repo = os.getenv("GITHUB_REPOSITORY", "")
          dist_dir = os.getenv("GITHUB_WORKSPACE") + "/dist"
          plugins = []

          # Quét tất cả file manifest.json trong các thư mục build con
          for manifest_path in glob.glob("**/build/manifest.json", recursive=True):
              try:
                  with open(manifest_path, "r", encoding="utf-8") as f:
                      data = json.load(f)
                      cs3_name = data.get("name", "") + ".cs3"
                      data["url"] = f"https://raw.githubusercontent.com/{repo}/builds/{cs3_name}"
                      plugins.append(data)
              except Exception as e:
                  print(f"Error reading {manifest_path}: {e}")

          # Ghi ra file plugins.json tổng tại thư mục dist
          with open(f"{dist_dir}/plugins.json", "w", encoding="utf-8") as f:
              json.dump(plugins, f, indent=4, ensure_ascii=False)
          '

          # Chuyển toàn bộ file ra thư mục builds để deploy
          mkdir -p $GITHUB_WORKSPACE/builds
          cp -r $GITHUB_WORKSPACE/dist/* $GITHUB_WORKSPACE/builds/

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
