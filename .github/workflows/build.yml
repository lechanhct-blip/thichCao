name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins and Generate CloudStream JSONs
        run: |
          chmod +x gradlew
          ./gradlew clean makeAll --no-build-cache --stacktrace

          mkdir -p $GITHUB_WORKSPACE/dist
          find . -path "./dist" -prune -o -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/dist \;

          cat << 'EOF' > generate_json.py
          import os
          import json
          import glob
          import re

          repo = os.getenv("GITHUB_REPOSITORY", "")
          workspace = os.getenv("GITHUB_WORKSPACE", "")
          dist_dir = os.path.join(workspace, "dist")
          plugin_list = []
          # Tìm pluginClassName bằng cách quét file Kotlin
          def find_plugin_class_name(provider_dir):
            kotlin_dir = os.path.join(provider_dir, "src", "main", "kotlin")
            if not os.path.exists(kotlin_dir):
              return None
        
            for root, _, files in os.walk(kotlin_dir):
              for file in files:
                if file.endswith(".kt"):
                  path = os.path.join(root, file)
                  with open(path, "r", encoding="utf-8") as f:
                    content = f.read()
                    if "@CloudstreamPlugin" in content:
                        pkg_match = re.search(r"package\s+([\w\.]+)", content)
                        class_match = re.search(r"class\s+(\w+)", content)
                        if pkg_match and class_match:
                            return f"{pkg_match.group(1)}.{class_match.group(1)}"
            return None


          def parse_gradle_kts(provider_name):
            info = {}
            provider_dir = os.path.join(workspace, provider_name)
            kts_path = os.path.join(provider_dir, "build.gradle.kts")
    
            if os.path.exists(kts_path):
              with open(kts_path, "r", encoding="utf-8") as f:
                content = f.read()
                # Tác giả
                authors_match = re.search(r"authors\s*=\s*listOf\((.*?)\)", content)
                if authors_match:
                  info["authors"] = [a.strip().strip("\"'") for a in authors_match.group(1).split(",")]

                  # Ngôn ngữ
                lang_match = re.search(r"language\s*=\s*[\"'](.*?)[\"']", content)
                if lang_match:
                  info["language"] = lang_match.group(1)

                # Mô tả
                desc_match = re.search(r"description\s*=\s*[\"'](.*?)[\"']", content)
                if desc_match:
                  info["description"] = desc_match.group(1)

                # Icon
                icon_match = re.search(r"iconUrl\s*=\s*[\"'](.*?)[\"']", content)
                if icon_match:
                  info["iconUrl"] = icon_match.group(1)
                
                # TV Types
                tv_match = re.search(r"tvTypes\s*=\s*listOf\((.*?)\)", content)
                if tv_match:
                  info["tvTypes"] = [t.strip().strip("\"'") for t in tv_match.group(1).split(",")]

            # Tự động quét pluginClassName từ file code .kt
            info["pluginClassName"] = find_plugin_class_name(provider_dir) or f"com.example.{provider_name}Plugin"
            return info

          # Quét thẳng danh sách các file .cs3 trong thư mục dist
          for cs3_file in glob.glob(os.path.join(dist_dir, "*.cs3")):
            cs3_name = os.path.basename(cs3_file)
            provider_name = os.path.splitext(cs3_name)[0]
  
            kts_info = parse_gradle_kts(provider_name)
            cs3_url = f"https://raw.githubusercontent.com/{repo}/builds/{cs3_name}"
    
            plugin_data = {
              "name": provider_name,
              "internalName": provider_name,
              "pluginClassName": kts_info["pluginClassName"],
              "version": 1,
              "url": cs3_url,
              "pluginUrl": cs3_url,
              "fileSize": os.path.getsize(cs3_file),
              "status": 1,
              "apiVersion": 1,
              "authors": kts_info.get("authors", ["Unknown"]),
              "language": kts_info.get("language", "vi"),
              "description": kts_info.get("description", ""),
              "iconUrl": kts_info.get("iconUrl", ""),
              "tvTypes": kts_info.get("tvTypes", ["Movie"]),
              "repositoryUrl": f"https://github.com/{repo}"
            }
    
            plugin_list.append(plugin_data)

          # 1. Xuất list.json
          with open(os.path.join(dist_dir, "list.json"), "w", encoding="utf-8") as f:
            json.dump(plugin_list, f, indent=4, ensure_ascii=False)

          # 2. Xuất plugins.json
          repo_manifest = {
            "name": "CaoCao Repo",
            "description": "Kho nguồn phim CaoCao",
            "manifestVersion": 1,
            "pluginLists": [
            f"https://raw.githubusercontent.com/{repo}/builds/list.json"
          ]




          

          with open(os.path.join(dist_dir, "plugins.json"), "w", encoding="utf-8") as f:
            json.dump(repo_manifest, f, indent=4, ensure_ascii=False)
          EOF

            python3 generate_json.py

            mkdir -p $GITHUB_WORKSPACE/builds
            cp -r $GITHUB_WORKSPACE/dist/* $GITHUB_WORKSPACE/builds/

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
