name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins and Generate Combined plugins.json
        run: |
          chmod +x gradlew
          ./gradlew clean makeAll --no-build-cache --stacktrace

          mkdir -p $GITHUB_WORKSPACE/dist

          find . -path "./dist" -prune -o -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/dist \;

          python3 -c '
          import os, json, glob, zipfile

          repo = os.getenv("GITHUB_REPOSITORY", "")
          dist_dir = os.getenv("GITHUB_WORKSPACE") + "/dist"
          plugin_list = []

          for cs3_file in glob.glob(f"{dist_dir}/*.cs3"):
              try:
                  with zipfile.ZipFile(cs3_file, "r") as z:
                      if "manifest.json" in z.namelist():
                          with z.open("manifest.json") as f:
                              data = json.load(f)
                              cs3_name = os.path.basename(cs3_file)
                              
                              data["url"] = f"https://raw.githubusercontent.com/{repo}/builds/{cs3_name}"
                              
                              # BẮT BUỘC: Đảm bảo luôn có các trường này ngay cả khi file manifest bị thiếu
                              if "authors" not in data or not data["authors"]:
                                  data["authors"] = ["lechanh"]
                              if "tvTypes" not in data or not data["tvTypes"]:
                                  data["tvTypes"] = ["NSFW"]
                              if "description" not in data:
                                  data["description"] = "No description"
                              if "status" not in data:
                                  data["status"] = 1
                              if "apiVersion" not in data:
                                  data["apiVersion"] = 1
                              
                              plugin_list.append(data)
              except Exception as e:
                  print(f"Error processing {cs3_file}: {e}")

          # Format Repository chuẩn không chứa vòng lặp pluginLists
          repo_data = {
              "name": "ThichCao Repository",
              "manifestVersion": 1,
              "plugins": plugin_list
          }

          with open(f"{dist_dir}/plugins.json", "w", encoding="utf-8") as f:
              json.dump(repo_data, f, indent=4, ensure_ascii=False)
          '

          mkdir -p $GITHUB_WORKSPACE/builds
          cp -r $GITHUB_WORKSPACE/dist/* $GITHUB_WORKSPACE/builds/

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
